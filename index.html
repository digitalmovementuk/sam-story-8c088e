<style>
  /* one gutter value: the gap between photos and the page edge are the same */
  :root{--g:4px;--bar:48px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0c0b0a;-webkit-text-size-adjust:100%}
  /* single column, centred; every photo whole - never cropped, never taller
     than the screen, so each one is fully visible as you scroll */
  body{background:#0c0b0a;overflow-x:hidden;
       padding:calc(var(--bar) + var(--g)) 0 var(--g);
       display:flex;flex-direction:column;align-items:center;gap:var(--g)}
  body>img{display:block;width:auto;height:auto;
           max-width:calc(100% - var(--g)*2);
           max-height:calc(100vh - var(--bar) - var(--g)*2);
           max-height:calc(100dvh - var(--bar) - var(--g)*2)}

  #bar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:20;
       display:flex;align-items:center;gap:8px;padding:0 12px;
       background:rgba(12,11,10,.82);backdrop-filter:blur(14px);
       -webkit-backdrop-filter:blur(14px);
       border-bottom:1px solid rgba(255,255,255,.10)}
  #bar .sp{flex:1}
  #bar button{font:500 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
              letter-spacing:.11em;text-transform:uppercase;color:#e9e0d2;
              background:transparent;border:1px solid rgba(233,224,210,.34);
              border-radius:2px;padding:10px 13px;cursor:pointer;
              -webkit-tap-highlight-color:transparent}
  #bar button:hover{border-color:rgba(233,224,210,.72);color:#fffdfa}
  #bar #present{border-color:rgba(233,224,210,.72)}
  @media (max-width:420px){ #bar button{padding:9px 9px;font-size:11px;letter-spacing:.06em} }

  /* presentation: one photo per screen, snapped */
  html.present{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  html.present #bar{display:none}
  html.present body{padding:0;gap:0}
  html.present body>img{width:100vw;height:100vh;height:100dvh;
                        max-width:none;max-height:none;object-fit:contain;
                        scroll-snap-align:start;scroll-snap-stop:always}
  @media (prefers-reduced-motion:reduce){ html.present{scroll-behavior:auto} }

  /* arrange: small squares you can drag into any order */
  #bar #done,#bar #reset,#bar .hint{display:none}
  html.arrange #bar #present,html.arrange #bar #upload,
  html.arrange #bar #download,html.arrange #bar #arrange{display:none}
  html.arrange #bar #done,html.arrange #bar #reset{display:block}
  html.arrange #bar #done{border-color:rgba(233,224,210,.72)}
  html.arrange #bar .hint{display:block;font:400 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       color:rgba(233,224,210,.62);letter-spacing:.04em}
  @media (max-width:560px){ html.arrange #bar .hint{display:none} }

  html.arrange body{padding:calc(var(--bar) + 10px) 10px 48px;
       display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
       gap:8px;align-items:start;align-content:start}
  @media (min-width:700px){ html.arrange body{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))} }
  html.arrange body>img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;
       max-width:none;max-height:none;cursor:grab;touch-action:manipulation;
       user-select:none;-webkit-user-select:none;-webkit-user-drag:none;
       outline:1px solid rgba(255,255,255,.10);outline-offset:-1px}
  /* the tile left behind shows where it will land */
  html.arrange body>img.ghosted{opacity:.22;outline:1px dashed rgba(233,224,210,.65)}
  /* the copy that follows the finger / cursor */
  html.arrange body>img.ghost{position:fixed;left:0;top:0;z-index:30;
       aspect-ratio:auto;pointer-events:none;opacity:.94;outline:none;
       box-shadow:0 14px 38px rgba(0,0,0,.62),0 0 0 1px rgba(233,224,210,.5)}
</style>

<body>

  <button id="reset" type="button">Reset order</button>
  <button id="arrange" type="button">Arrange</button>
  <button id="upload" type="button">Upload</button>
  <button id="download" type="button">Download</button>
  <input id="file" type="file" accept="image/*" multiple hidden>
</header>

<script>
(function(){
  var root=document.documentElement, body=document.body;
  function imgs(){return [].slice.call(document.querySelectorAll("body>img:not(.ghost)"));}
  /* which photo is in the middle of the screen right now */
  function centred(){
    var mid=scrollY+innerHeight/2, idx=0, best=1/0;
    imgs().forEach(function(im,i){
      var d=Math.abs(im.offsetTop+im.offsetHeight/2-mid);
      if(d<best){best=d;idx=i;}
    });
    return idx;
  }
  function scrollToIdx(idx,pad){
    requestAnimationFrame(function(){
      var im=imgs()[idx]; if(im) scrollTo(0, Math.max(0, im.offsetTop-pad));
    });
  }

  /* ---- presentation mode -------------------------------------------- */
  function enter(){
    var idx=centred();
    root.classList.add("present");
    if(root.requestFullscreen) root.requestFullscreen().catch(function(){});
    requestAnimationFrame(function(){
      var b=root.style.scrollBehavior; root.style.scrollBehavior="auto";
      scrollTo(0, idx*innerHeight);
      requestAnimationFrame(function(){ root.style.scrollBehavior=b; });
    });
  }
  function leave(){
    var idx=Math.round(scrollY/innerHeight);
    root.classList.remove("present");
    if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(function(){});
    scrollToIdx(idx,56);
  }
  function page(d){
    var i=Math.round(scrollY/innerHeight);
    scrollTo({top:Math.max(0,i+d)*innerHeight, behavior:"smooth"});
  }
  document.getElementById("present").onclick=enter;
  document.addEventListener("fullscreenchange",function(){
    if(!document.fullscreenElement && root.classList.contains("present")) leave();
  });
  addEventListener("keydown",function(e){
    var on=root.classList.contains("present");
    if(e.key==="Escape"&&root.classList.contains("arrange")){ arrangeOff(); return; }
    if(e.key==="Escape"&&on){ leave(); return; }
    if(!on) return;
    if([" ","ArrowDown","ArrowRight","PageDown"].indexOf(e.key)>-1){e.preventDefault();page(1);}
    if(["ArrowUp","ArrowLeft","PageUp"].indexOf(e.key)>-1){e.preventDefault();page(-1);}
    if(e.key==="Home"){e.preventDefault();scrollTo({top:0,behavior:"smooth"});}
  });
  addEventListener("click",function(e){
    if(!root.classList.contains("present")) return;
    page(e.clientX < innerWidth*0.25 ? -1 : 1);
  });

  /* ---- upload: kept in this browser, added to the end of the roll ----- */
  var DB=null;
  function db(){
    if(DB) return Promise.resolve(DB);
    return new Promise(function(res,rej){
      var r=indexedDB.open("sam-photos",1);
      r.onupgradeneeded=function(){ r.result.createObjectStore("up",{keyPath:"id",autoIncrement:true}); };
      r.onsuccess=function(){ DB=r.result; res(DB); };
      r.onerror=function(){ rej(r.error); };
    });
  }
  function show(blob,name,id){
    var im=new Image();
    im.src=URL.createObjectURL(blob); im.alt=""; im.dataset.up=name||"upload.jpg";
    if(id!=null) im.dataset.key="up:"+id;   /* survives a reload, the blob URL does not */
    body.appendChild(im);
    return im;
  }
  db().then(function(d){
    var s=d.transaction("up","readonly").objectStore("up").getAll();
    s.onsuccess=function(){
      (s.result||[]).forEach(function(r){ show(r.blob,r.name,r.id); });
      applyOrder();                          /* uploads land in their saved spot too */
    };
  }).catch(function(){});
  var fi=document.getElementById("file");
  document.getElementById("upload").onclick=function(){ fi.click(); };
  fi.onchange=function(){
    var list=[].slice.call(fi.files);
    db().then(function(d){
      var st=d.transaction("up","readwrite").objectStore("up");
      list.forEach(function(f){
        var im=show(f,f.name), rq=st.add({blob:f,name:f.name});
        rq.onsuccess=function(){ im.dataset.key="up:"+rq.result; saveOrder(); };
      });
    }).catch(function(){ list.forEach(function(f){ show(f,f.name); }); });
    fi.value="";
  };

  /* ---- download: every photo, in order, as one zip -------------------- */
  var T=(function(){var t=new Uint32Array(256);
    for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
    return t;})();
  function crc32(u){var c=0xFFFFFFFF;for(var i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function zip(files){
    var enc=new TextEncoder(), parts=[], cd=[], off=0;
    files.forEach(function(f){
      var nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
      var h=new Uint8Array(30+nm.length), v=new DataView(h.buffer);
      v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true);
      v.setUint32(14,crc,true); v.setUint32(18,sz,true); v.setUint32(22,sz,true);
      v.setUint16(26,nm.length,true); h.set(nm,30);
      parts.push(h,f.data);
      var c=new Uint8Array(46+nm.length), w=new DataView(c.buffer);
      w.setUint32(0,0x02014b50,true); w.setUint16(4,20,true); w.setUint16(6,20,true);
      w.setUint32(16,crc,true); w.setUint32(20,sz,true); w.setUint32(24,sz,true);
      w.setUint16(28,nm.length,true); w.setUint32(42,off,true); c.set(nm,46);
      cd.push(c); off+=h.length+sz;
    });
    var cdLen=cd.reduce(function(a,b){return a+b.length;},0);
    var e=new Uint8Array(22), v=new DataView(e.buffer);
    v.setUint32(0,0x06054b50,true); v.setUint16(8,files.length,true);
    v.setUint16(10,files.length,true); v.setUint32(12,cdLen,true); v.setUint32(16,off,true);
    return new Blob(parts.concat(cd,[e]),{type:"application/zip"});
  }
  var dl=document.getElementById("download"), label=dl.textContent;
  dl.onclick=function(){
    if(dl.disabled) return;
    dl.disabled=true;
    var list=imgs(), files=[], i=0;
    (function next(){
      if(i>=list.length){
        dl.textContent=label; dl.disabled=false;
        var a=document.createElement("a");
        a.href=URL.createObjectURL(zip(files));
        a.download="sam-emilie-photos.zip"; a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
        return;
      }
      /* files are numbered in the order shown on the page, so the zip keeps it */
      dl.textContent=Math.round(i/list.length*100)+"%";
      fetch(list[i].src).then(function(r){return r.arrayBuffer();}).then(function(b){
        var n=("0"+(i+1)).slice(-2)+".jpg";
        files.push({name:n,data:new Uint8Array(b)}); i++; next();
      }).catch(function(){ i++; next(); });
    })();
  };

  /* ---- arrange: drag a photo to a new place, mouse or finger ---------- */
  var ORDER="sam-photo-order";

  function keyOf(im){ return im.dataset.key || im.getAttribute("src") || ""; }
  function saveOrder(){
    try{ localStorage.setItem(ORDER, JSON.stringify(imgs().map(keyOf))); }catch(e){}
  }
  function applyOrder(){
    var saved=null;
    try{ saved=JSON.parse(localStorage.getItem(ORDER)||"null"); }catch(e){}
    if(!saved||!saved.length) return;
    var at={}; saved.forEach(function(k,i){ at[k]=i; });
    /* anything not in the saved list keeps its own order and goes last */
    imgs().map(function(im,i){
      var k=keyOf(im);
      return {im:im, i:i, p:(at.hasOwnProperty(k)?at[k]:1e9+i)};
    }).sort(function(a,b){ return (a.p-b.p)||(a.i-b.i); })
      .forEach(function(o){ body.appendChild(o.im); });
  }

  function arrangeOn(){
    var idx=centred();
    root.classList.add("arrange");
    scrollToIdx(idx,60);
  }
  function arrangeOff(){
    var idx=centred();
    endDrag();
    root.classList.remove("arrange");
    scrollToIdx(idx,56);
  }
  document.getElementById("arrange").onclick=arrangeOn;
  document.getElementById("done").onclick=arrangeOff;
  document.getElementById("reset").onclick=function(){
    if(!confirm("Put every photo back in its original order?")) return;
    try{ localStorage.removeItem(ORDER); }catch(e){}
    location.reload();
  };

  var drag=null, hold=null;

  function tile(t){
    return (t&&t.tagName==="IMG"&&t.parentNode===body&&!t.classList.contains("ghost"))?t:null;
  }
  function moveGhost(){
    drag.ghost.style.transform="translate("+(drag.x-drag.dx)+"px,"+(drag.y-drag.dy)+"px)";
  }
  function startDrag(im,x,y){
    var r=im.getBoundingClientRect(), g=im.cloneNode(false);
    g.className="ghost"; g.removeAttribute("loading");
    g.style.width=r.width+"px"; g.style.height=r.height+"px";
    body.appendChild(g);
    drag={im:im,ghost:g,x:x,y:y,dx:x-r.left,dy:y-r.top};
    im.classList.add("ghosted");
    moveGhost();
    requestAnimationFrame(tick);
  }
  /* drop it wherever the pointer is: past a tile's middle means after it */
  function dropAt(x,y){
    if(!drag) return;
    var over=tile(document.elementFromPoint(x,y));
    if(!over||over===drag.im) return;
    var r=over.getBoundingClientRect();
    body.insertBefore(drag.im, x>r.left+r.width/2 ? over.nextSibling : over);
  }
  /* keep scrolling while the pointer sits near the top or bottom edge */
  function tick(){
    if(!drag) return;
    var edge=110, top=48+edge, bot=innerHeight-edge, v=0;
    if(drag.y<top) v=-(top-drag.y)/edge*22;
    else if(drag.y>bot) v=(drag.y-bot)/edge*22;
    if(v){ scrollBy(0,v); moveGhost(); dropAt(drag.x,drag.y); }
    requestAnimationFrame(tick);
  }
  function endDrag(){
    if(hold){ clearTimeout(hold.t); hold=null; }
    if(!drag) return;
    drag.ghost.remove();
    drag.im.classList.remove("ghosted");
    drag=null;
    saveOrder();
  }

  body.addEventListener("pointerdown",function(e){
    if(!root.classList.contains("arrange")||drag) return;
    var im=tile(e.target); if(!im) return;
    if(e.pointerType==="touch"){
      /* a plain swipe still scrolls; only a short hold picks the photo up */
      hold={x:e.clientX,y:e.clientY,t:setTimeout(function(){
        hold=null; startDrag(im,e.clientX,e.clientY);
      },200)};
    }else{
      e.preventDefault();
      startDrag(im,e.clientX,e.clientY);
    }
  });
  addEventListener("pointermove",function(e){
    if(hold&&Math.abs(e.clientX-hold.x)+Math.abs(e.clientY-hold.y)>10){
      clearTimeout(hold.t); hold=null;          /* it was a scroll, not a hold */
    }
    if(!drag) return;
    drag.x=e.clientX; drag.y=e.clientY;
    moveGhost(); dropAt(drag.x,drag.y);
  });
  addEventListener("pointerup",endDrag);
  addEventListener("pointercancel",endDrag);
  /* stop the page scrolling under a finger that is dragging a photo */
  addEventListener("touchmove",function(e){ if(drag) e.preventDefault(); },{passive:false});
  body.addEventListener("dragstart",function(e){
    if(root.classList.contains("arrange")) e.preventDefault();
  });

  applyOrder();
})();
</script>
</body>
