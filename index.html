<script>
  var H=function(){return window.innerHeight};
  function go(d){var i=Math.round(scrollY/H());scrollTo({top:Math.max(0,i+d)*H(),behavior:"smooth"});}
  addEventListener("keydown",function(e){
    if([" ","ArrowDown","ArrowRight","PageDown"].indexOf(e.key)>-1){e.preventDefault();go(1);}
    if(["ArrowUp","ArrowLeft","PageUp"].indexOf(e.key)>-1){e.preventDefault();go(-1);}
    if(e.key==="Home"){e.preventDefault();scrollTo({top:0,behavior:"smooth"});}
    if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  });
  addEventListener("click",function(e){ go(e.clientX < innerWidth*0.25 ? -1 : 1); });
</script>
