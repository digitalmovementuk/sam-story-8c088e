<style>
  /* one gutter value, used for the gaps and the page edge alike */
  :root{--g:4px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0c0b0a}
  body{background:#0c0b0a;overflow-x:hidden;padding:var(--g);
       display:grid;gap:var(--g);grid-template-columns:repeat(2,1fr)}
  body>img{width:100%%;aspect-ratio:1/1;object-fit:cover;object-position:center 38%%;
           display:block;min-width:0;background:#151312}
  @media (min-width:700px){ body{grid-template-columns:repeat(3,1fr)} }
  @media (min-width:1100px){ body{grid-template-columns:repeat(4,1fr)} }
  @media (min-width:1700px){ body{grid-template-columns:repeat(5,1fr)} }
  /* one photo per screen while a picture is opened full size */
  body>img.zoom{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;
                aspect-ratio:auto;object-fit:contain;background:#0c0b0a;z-index:9;cursor:zoom-out}

<script>
  addEventListener("click",function(e){
    var t=e.target;
    if(t.tagName!=="IMG")return;
    var z=document.querySelector("img.zoom");
    if(z){z.classList.remove("zoom"); if(z!==t){t.classList.add("zoom");} return;}
    t.classList.add("zoom");
  });
  addEventListener("keydown",function(e){
    if(e.key==="Escape"){var z=document.querySelector("img.zoom"); if(z)z.classList.remove("zoom");}
    if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  });
</script>
